name: Browser CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: npm install

      # The runner image ships Google Chrome. Attaching to it needs no apt packages.
      - run: google-chrome --headless --remote-debugging-port=9222 about:blank &
      - run: curl -fsS --retry 10 --retry-connrefused http://127.0.0.1:9222/json/version

      - run: make -C browser test
        env:
          PLAYWRIGHT_CONFIG: node_modules/playwright-js-cli/playwright-config/connect-over-cdp.json
