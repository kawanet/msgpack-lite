name: Browser CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # browser/Makefile attaches to the Chrome on this port instead of installing one.
    env:
      CDP_PORT: 9222

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: npm install

      # The runner image ships Google Chrome. Attaching to it needs no apt packages.
      - run: dbus-run-session -- google-chrome --headless --remote-debugging-port=$CDP_PORT about:blank &
      - run: curl -fsS --retry 10 --retry-connrefused http://127.0.0.1:$CDP_PORT/json/version

      - run: make -C browser test
